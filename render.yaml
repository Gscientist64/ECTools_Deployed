services:
  - type: web
    name: ecews-backend
    env: python
    runtime: python311
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements-render.txt
    startCommand: gunicorn --chdir backend "app:create_app()" --workers 2 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    preDeployCommand: |
      cd backend && FLASK_APP=app:create_app python -m flask db upgrade
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: PRODUCTION
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SESSION_COOKIE_SAMESITE
        value: "None"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "TIMS <onboarding@resend.dev>"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: "TIMS"
      - key: ADMIN_SIGNUP_KEY
        sync: false
