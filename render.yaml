services:
  - type: web
    name: ecews-backend
    env: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: cd backend && gunicorn "app:create_app()" --workers 2 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    preDeployCommand: |
      bash -lc 'FLASK_APP=app:create_app python -m flask db upgrade'
    envVars:
      - key: PRODUCTION
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SESSION_COOKIE_SAMESITE
        value: "None"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ADMIN_SIGNUP_KEY
        sync: false
